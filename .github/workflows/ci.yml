name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ChickenKit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run package tests
        run: swift test --package-path Packages/ChickenKit

  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS Simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Chicken.xcodeproj \
            -scheme Chicken \
            -configuration Release \
            -destination 'generic/platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO
